project:
  type: book
  output-dir: _site

book:
  title: "EHDS（欧州健康データ空間）包括的分析レポート"
  subtitle: "日本の医療データスペース構築への戦略的示唆"
  author: 
    - name: "dobachi"
  date: "2025-08-13"
  downloads: []
  
  chapters:
    - index.qmd
    - part: "概要と背景"
      chapters:
        - 01-introduction.qmd
        - 02-regulatory-framework.qmd
    - part: "技術と実装"
      chapters:
        - 03-technical-architecture.qmd
        - 04-implementation-cases.qmd
    - part: "日本への展開"
      chapters:
        - 05-japan-recommendations.qmd
        - 06-technical-guidelines.qmd
    - 08-conclusion.qmd
    - references.qmd
  
  appendices:
    - A-glossary.qmd
    - B-resources.qmd
    - C-full-references.qmd
    - D-medical-economic-analysis.qmd

bibliography: references.bib
csl: ieee.csl

format:
  html:
    theme: 
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 3
    toc-location: left
    number-sections: true
    number-depth: 3
    code-fold: true
    code-tools: true
    highlight-style: github
    css: styles.css
    downloads: []
    mermaid:
      theme: default
    include-in-header:
      - text: |
          <style>
          .fact {
            background-color: #e8f4f8;
            padding: 10px;
            border-left: 4px solid #0066cc;
            margin: 10px 0;
          }
          .analysis {
            background-color: #f8f4e8;
            padding: 10px;
            border-left: 4px solid #cc6600;
            margin: 10px 0;
          }
          /* Mermaid diagram styles */
          .mermaid {
            background-color: white !important;
          }
          .mermaid rect {
            fill: #f9f9f9 !important;
            stroke: #333 !important;
          }
          .mermaid text {
            fill: #333 !important;
          }
          .mermaid .node rect {
            fill: #fff !important;
            stroke: #333 !important;
          }
          .mermaid .node text {
            fill: #333 !important;
          }
          .mermaid .edgeLabel {
            background-color: white !important;
            fill: #333 !important;
          }
          </style>
  
  pdf:
    documentclass: scrreprt
    papersize: a4
    toc: true
    toc-depth: 3
    number-sections: true
    colorlinks: true
    linkcolor: blue
    urlcolor: blue
    citecolor: blue
    pdf-engine: lualatex
    keep-tex: false
    mainfont: "Noto Sans CJK JP"
    sansfont: "Noto Sans CJK JP"
    monofont: "Noto Sans Mono CJK JP"

execute:
  enabled: false

# GitHub Pages設定
website:
  site-url: "https://dobachi.github.io/ehds-analysis"
  repo-url: "https://github.com/dobachi/ehds-analysis"
  repo-actions: [source, issue]

language:
  ui:
    chapter-name: "第"
    part-name: "部"
    appendix-name: "付録"
    figure-name: "図"
    table-name: "表"
    listing-name: "リスト"
    proof-name: "証明"